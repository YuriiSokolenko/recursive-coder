// CI-only dependency population and offline proof; never executes test tasks.
// Explicitly resolve external artifacts, not just the dependency graph or
// project outputs. Gradle strict verification still applies to every artifact.
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.tasks.SourceSetContainer

gradle.projectsEvaluated {
    def buildRoot = gradle.rootProject
    buildRoot.tasks.register("resolveCiTestRuntime") {
        group = "verification"
        description = "Resolve external JVM test and test-fixture runtime artifacts."
        doLast {
            def javaProjects = buildRoot.allprojects.findAll {
                it.plugins.hasPlugin("java")
            }.sort { it.path }
            if (javaProjects.isEmpty()) {
                throw new GradleException("No JVM projects for CI runtime resolution")
            }
            int testConfigurations = 0
            javaProjects.each { project ->
                def sourceSets = project.extensions.getByType(SourceSetContainer)
                def test = sourceSets.getByName("test")
                def fixtures = sourceSets.findByName("testFixtures")
                [test, fixtures].findAll { it != null }.each { sourceSet ->
                    def configuration = project.configurations.getByName(
                        sourceSet.runtimeClasspathConfigurationName
                    )
                    if (!configuration.canBeResolved) {
                        throw new GradleException("Non-resolvable runtime: " +
                            "${project.path}:${configuration.name}")
                    }
                    def external = configuration.incoming.artifactView { view ->
                        view.componentFilter { id -> id instanceof ModuleComponentIdentifier }
                    }.files.files
                    if (sourceSet.name == "test") {
                        testConfigurations++
                        if (external.isEmpty()) {
                            throw new GradleException("Empty test runtime: ${project.path}")
                        }
                    }
                    logger.lifecycle("CI runtime ${project.path}:${configuration.name}: " +
                        "${external.size()} external artifacts")
                }
            }
            if (testConfigurations != javaProjects.size()) {
                throw new GradleException("Incomplete JVM test runtime coverage")
            }
            logger.lifecycle("CI test runtime coverage: ${testConfigurations} JVM projects")
        }
    }
}
