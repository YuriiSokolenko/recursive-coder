name: Recursive Coder CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recursive-coder-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    name: Kotlin JVM / Koog dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
      - name: Compile and test standalone JVM project
        run: ./gradlew --no-daemon test --stacktrace

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical JSON Schema validator
        run: python -m pip install jsonschema==4.25.1
      - name: Execute installed CLI and validate result/events against v1 schema
        run: python -m unittest discover -s tests -p 'test_cli_runtime_v1.py' -v

  contracts:
    name: Versioned session contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce English-only repository documentation
        run: |
          if LC_ALL=C.UTF-8 grep -nP '[\\p{Cyrillic}]' README.md CONTRIBUTING.md contracts/README.md docs/architecture/*.md; then
            echo 'Documentation must use English only'
            exit 1
          fi
      - name: Install JSON Schema 2020-12 validator
        run: python -m pip install jsonschema==4.25.1
      - name: Validate full schema, fixtures and negative compatibility cases
        run: python -m unittest discover -s tests -p 'test_contract*.py' -v
      - name: Run standalone legacy compatibility cases and keyword guard
        run: node --test contracts/v1/session-v1.test.mjs
