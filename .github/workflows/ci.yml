name: Recursive Coder CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recursive-coder-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Architecture boundaries and pure unit tests
    # Dedicated repository-scoped N150 runner; no GitHub-hosted fallback.
    # The repository is public, so never run untrusted fork PR code on this host.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, n150, recursive-coder-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
      - name: Verify architecture and run pure unit tests
        run: ./gradlew --no-daemon checkArchitecture checkTestTiers unitTest --stacktrace
      - name: Test independent architecture graph verifier
        run: ./gradlew --no-daemon -p build-logic test --stacktrace
      - name: Prove fresh and reused Gradle configuration cache
        run: |
          rm -rf .gradle/configuration-cache
          ./gradlew --no-daemon --offline --console=plain --configuration-cache checkArchitecture | tee /tmp/architecture-cache-first.log
          grep -F 'Configuration cache entry stored.' /tmp/architecture-cache-first.log
          ./gradlew --no-daemon --offline --console=plain --configuration-cache checkArchitecture | tee /tmp/architecture-cache-second.log
          grep -F 'Reusing configuration cache.' /tmp/architecture-cache-second.log
      - name: Reject illegal edges, cycles and stale configuration-cache snapshots
        run: python3 -m unittest discover -s tests -p 'test_architecture_gradle.py' -v
      - name: Validate test tier guard against negative bytecode fixtures
        run: |
          python3 - <<'PY'
          import unittest

          suite = unittest.defaultTestLoader.discover("tests", pattern="test_test_tiers.py")
          expected = suite.countTestCases()
          if not expected:
              raise SystemExit("Test tier regression fixtures must be discovered")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped or not result.wasSuccessful() or result.testsRun != expected:
              raise SystemExit("Test tier regression fixtures must all run and pass without skips")
          print(f"Verified {result.testsRun} passing test tier regression fixtures (0 skips)")
          PY
      - name: Ensure the pure unit suite actually executed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          files = list(Path(".").glob("**/build/test-results/unitTest/TEST-*.xml"))
          cases = [case for path in files for case in ET.parse(path).iter("testcase")]
          if not cases or any(
              case.find(tag) is not None for case in cases
              for tag in ("skipped", "failure", "error")
          ):
              raise SystemExit("Pure unit suite must run and pass without skips")
          print(f"Verified {len(cases)} passing pure unit tests")
          PY

  kotlin:
    name: Full JVM integration and sandbox E2E
    # Dedicated repository-scoped N150 runner; no GitHub-hosted fallback.
    # The repository is public, so never run untrusted fork PR code on this host.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, n150, recursive-coder-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
      # Provision bubblewrap and namespace permissions in the isolated runner
      # image/host. CI must never weaken host-wide security settings.
      - name: Check preinstalled sandbox prerequisites
        run: |
          if ! command -v bwrap >/dev/null; then
            echo "::error::Install bubblewrap in the dedicated N150 CI runner image."
            exit 1
          fi
      - name: Verify bubblewrap isolation is executable
        run: |
          /usr/bin/bwrap --die-with-parent --new-session --unshare-all \
            --tmpfs / --proc /proc --dev /dev \
            --ro-bind /usr /usr --ro-bind /bin /bin \
            --ro-bind /lib /lib --ro-bind /lib64 /lib64 \
            -- /usr/bin/true
      - name: Compile and test standalone Gradle modules and distribution
        env:
          CI: 'true'
        run: ./gradlew --no-daemon clean test integrationTest e2eTest installDist --stacktrace
      - name: Confirm sandbox integration test was not skipped
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          files = list(Path(".").glob("**/build/test-results/test/TEST-*.xml"))
          cases = [
              case
              for path in files
              for case in ET.parse(path).iter("testcase")
              if case.get("name", "").startswith(
                  "realSeparatelyExecutedSandboxedTestPassesIfHostSupportsUserNamespaces"
              )
          ]
          if len(cases) != 1 or any(
              case.find(tag) is not None for case in cases for tag in ("skipped", "failure", "error")
          ):
              raise SystemExit("Sandbox integration MUST run and pass exactly once in CI")
          print("Verified sandbox integration executed and passed (0 skips).")
          PY
      - name: Verify focused integration excludes sandbox and E2E includes it once
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          marker = "realSeparatelyExecutedSandboxedTestPassesIfHostSupportsUserNamespaces"
          def read_cases(tier):
              files = list(Path(".").glob(f"**/build/test-results/{tier}/TEST-*.xml"))
              return [case for file in files for case in ET.parse(file).iter("testcase")]
          integration = read_cases("integrationTest")
          e2e = read_cases("e2eTest")
          sandbox = [case for case in e2e if case.get("name", "").startswith(marker)]
          if not integration or any(case.get("name", "").startswith(marker) for case in integration):
              raise SystemExit("integrationTest must run ordinary integration tests but exclude sandbox E2E")
          if len(sandbox) != 1 or any(
              case.find(tag) is not None for case in sandbox for tag in ("skipped", "failure", "error")
          ):
              raise SystemExit("e2eTest must select exactly one passing sandbox test")
          print("Verified focused integration excludes sandbox; focused E2E runs it once.")
          PY
      - name: Publish Kotlin JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recursive-coder-junit-results
          path: '**/build/test-results/test/TEST-*.xml'
          if-no-files-found: error

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical JSON Schema validator
        run: python -m pip install jsonschema==4.25.1
      - name: Execute installed CLI and validate result/events against v1 schema
        run: python -m unittest discover -s tests -p 'test_cli_runtime_v1.py' -v

  contracts:
    name: Versioned session contracts
    # Dedicated repository-scoped N150 runner; no GitHub-hosted fallback.
    # The repository is public, so never run untrusted fork PR code on this host.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, n150, recursive-coder-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce English-only repository documentation
        run: |
          if LC_ALL=C.UTF-8 grep -nP '[\p{Cyrillic}]' README.md CONTRIBUTING.md contracts/README.md docs/architecture/*.md; then
            echo 'Documentation must use English only'
            exit 1
          fi
      - name: Install JSON Schema 2020-12 validator
        run: python -m pip install jsonschema==4.25.1
      - name: Validate full schema, fixtures and negative compatibility cases
        run: python -m unittest discover -s tests -p 'test_contract*.py' -v
      - name: Run standalone legacy compatibility cases and keyword guard
        run: node --test contracts/v1/session-v1.test.mjs
