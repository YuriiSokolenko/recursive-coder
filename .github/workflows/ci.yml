name: Recursive Coder CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.caching=false

concurrency:
  group: recursive-coder-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    needs: [bytecode-verifier, bytecode-build]
    name: Architecture boundaries and pure unit tests
    # Public repository: use a fresh GitHub-hosted VM, including for fork PRs.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Audit reviewed CI action SHAs and Gradle bootstrap
        run: python3 -I tools/check_ci_bootstrap.py --audit
      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
      # CI ./gradlew requires the verified Gradle executable, not a PATH fallback.
      # The explicit --dependency-verification strict flags are defense in depth;
      # settings.gradle.kts is the authoritative guard against off/lenient modes.
      - name: Install SHA-256-verified Gradle 9.8.2
        run: python3 -I tools/check_ci_bootstrap.py --install-gradle
      - name: Prepare fresh Gradle user home
        run: |
          mkdir "$RUNNER_TEMP/recursive-gradle-home"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/recursive-gradle-home" >> "$GITHUB_ENV"
      - name: Download current-run Gradle module cache
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: gradle-module-cache
          path: ${{ runner.temp }}/recursive-gradle-module-cache
      - name: Verify current-run module cache before Gradle resolution
        run: |
          python3 -I tools/check_dependency_verification.py --restore-module-cache \
            "$RUNNER_TEMP/recursive-gradle-module-cache" \
            "$GRADLE_USER_HOME/caches/modules-2"
          rm -rf "$RUNNER_TEMP/recursive-gradle-module-cache"
      - name: Resolve Gradle plugins with bounded registry retry
        run: python3 -I tools/run_ci_gradle.py --retry-resolution --label plugin-resolution -- ./gradlew --dependency-verification strict --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1g --no-build-cache help
      - name: Verify public-runner toolchain
        run: |
          java -version
          test "$(command -v gradle)" = "$RECURSIVE_VERIFIED_GRADLE"
          "$RECURSIVE_VERIFIED_GRADLE" --version | grep -F 'Gradle 9.8.2'
          python3 --version
      - name: Require locked root and standalone build-logic dependencies
        run: python3 -I tools/check_dependency_verification.py
      - name: Verify architecture, root check and pure unit tests
        # checkTestTiers is a dependency of the single root check; -x test
        # preserves the separate full unfiltered JVM/sandbox job.
        run: python3 -I tools/run_ci_gradle.py --label architecture-check -- ./gradlew --dependency-verification strict --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1g --no-build-cache checkArchitecture check unitTest -x test --stacktrace
      - name: Assert root check schedules test-tier verification exactly once
        run: |
          ./gradlew --dependency-verification strict --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1g --no-build-cache --offline --console=plain check --dry-run > "$RUNNER_TEMP/check-task-plan.log"
          ./gradlew --dependency-verification strict --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1g --no-build-cache --offline --console=plain -q printTestTierModules > "$RUNNER_TEMP/check-expected-modules.log"
          ./gradlew --dependency-verification strict --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1g --no-build-cache --offline --console=plain :checkTestTiers --dry-run > "$RUNNER_TEMP/guard-task-plan.log"
          python3 - <<'PY'
          import os
          from pathlib import Path

          plan = (Path(os.environ["RUNNER_TEMP"]) / "check-task-plan.log").read_text()
          guard_plan = (Path(os.environ["RUNNER_TEMP"]) / "guard-task-plan.log").read_text()
          count = sum(line.strip() == ":checkTestTiers SKIPPED" for line in plan.splitlines())
          if count != 1:
              raise SystemExit(f"Root Gradle check must schedule checkTestTiers once; found {count}")
          expected = {
              line.removeprefix("TEST_TIER_MODULE=")
              for line in (Path(os.environ["RUNNER_TEMP"]) / "check-expected-modules.log").read_text().splitlines()
              if line.startswith("TEST_TIER_MODULE=")
          }
          actual = {
              line.strip().removesuffix(" SKIPPED")
              for line in guard_plan.splitlines()
              if line.strip().endswith(":testClasses SKIPPED")
          }
          if not expected or actual != expected:
              raise SystemExit(f"Wrong testClasses graph: missing={sorted(expected - actual)}, unexpected={sorted(actual - expected)}")
          print("Verified root check schedules one guard and the guard alone schedules all testClasses")
          PY
      - name: Prove trusted running host opt-in at the Kotlin compiler boundary
        run: python3 -I tools/run_ci_gradle.py --label running-host-opt-in -- ./gradlew --dependency-verification strict --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1g --no-build-cache :infra:journal:verifyRunningHostOptIn --stacktrace
      - name: Test independent architecture graph verifier
        run: python3 -I tools/run_ci_gradle.py --label standalone-build-logic-test -- ./gradlew --dependency-verification strict --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1g --no-build-cache -p build-logic test --stacktrace
      - name: Prove fresh and reused Gradle configuration cache
        run: |
          rm -rf .gradle/configuration-cache
          ./gradlew --dependency-verification strict --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1g --no-build-cache --offline --console=plain --configuration-cache checkArchitecture | tee /tmp/architecture-cache-first.log
          grep -F 'Configuration cache entry stored.' /tmp/architecture-cache-first.log
          ./gradlew --dependency-verification strict --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1g --no-build-cache --offline --console=plain --configuration-cache checkArchitecture | tee /tmp/architecture-cache-second.log
          grep -F 'Reusing configuration cache.' /tmp/architecture-cache-second.log
      - name: Reject illegal edges, cycles and stale configuration-cache snapshots
        run: python3 -m unittest discover -s tests -p 'test_architecture_gradle.py' -v
      - name: Validate actual Kotlin-generated test tier fixtures
        run: python3 -I tools/run_ci_gradle.py --label kotlin-tier-fixtures -- ./gradlew --dependency-verification strict --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1g --no-build-cache :core:contracts:checkKotlinTierFixtures --stacktrace
      - name: Validate test tier guard against negative bytecode fixtures
        run: |
          python3 - <<'PY'
          import unittest

          suite = unittest.defaultTestLoader.discover("tests", pattern="test_test_tiers.py")
          expected = suite.countTestCases()
          if not expected:
              raise SystemExit("Test tier regression fixtures must be discovered")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped or not result.wasSuccessful() or result.testsRun != expected:
              raise SystemExit("Test tier regression fixtures must all run and pass without skips")
          print(f"Verified {result.testsRun} passing test tier regression fixtures (0 skips)")
          PY
      - name: Reject missing or unexecuted preparation host conformance
        run: |
          python3 - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover("tests", pattern="test_preparation_host_conformance.py")
          expected = suite.countTestCases()
          if not expected:
              raise SystemExit("Preparation host gate regressions must be discovered")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped or not result.wasSuccessful() or result.testsRun != expected:
              raise SystemExit("Preparation host gate regressions must all pass without skips")
          PY
      - name: Ensure the pure unit suite actually executed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          files = list(Path(".").glob("**/build/test-results/unitTest/TEST-*.xml"))
          cases = [case for path in files for case in ET.parse(path).iter("testcase")]
          if not cases or any(
              case.find(tag) is not None for case in cases
              for tag in ("skipped", "failure", "error")
          ):
              raise SystemExit("Pure unit suite must run and pass without skips")
          print(f"Verified {len(cases)} passing pure unit tests")
          PY

  bytecode-build:
    name: Build isolated production verifier input
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Audit reviewed CI action SHAs and Gradle bootstrap
        run: python3 -I tools/check_ci_bootstrap.py --audit
      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SHA-256-verified Gradle 9.8.2
        run: python3 -I tools/check_ci_bootstrap.py --install-gradle
      - name: Prepare fresh Gradle user home
        run: |
          mkdir "$RUNNER_TEMP/recursive-gradle-home"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/recursive-gradle-home" >> "$GITHUB_ENV"
      - name: Restore protected-branch Gradle module cache
        id: gradle-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/recursive-gradle-module-cache
          key: gradle-module-cache-v2-${{ runner.os }}-${{ runner.arch }}-9.8.2-${{ hashFiles('gradle/verification-metadata.xml', 'build-logic/gradle/verification-metadata.xml', 'build-logic/gradle/libs.versions.toml', '**/settings.gradle.kts', '**/build.gradle.kts', 'gradle.properties', 'tools/check_dependency_verification.py', '.github/workflows/ci.yml') }}
      - name: Verify restored module cache before Gradle resolution
        env:
          CACHE_HIT: ${{ steps.gradle-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = true ]; then
            python3 -I tools/check_dependency_verification.py --restore-module-cache \
              "$RUNNER_TEMP/recursive-gradle-module-cache" \
              "$GRADLE_USER_HOME/caches/modules-2"
          else
            echo "No exact dependency cache hit; resolve from official repositories"
          fi
          rm -rf "$RUNNER_TEMP/recursive-gradle-module-cache"
      - name: Enforce SHA-256 dependency trust and test negative cache fixtures
        run: python3 -I tools/check_dependency_verification.py --negative-fixtures
      - name: Resolve Gradle plugins with bounded registry retry
        run: python3 -I tools/run_ci_gradle.py --retry-resolution --label plugin-resolution -- ./gradlew --dependency-verification strict --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1g --no-build-cache help
      - name: Preflight bytecode guard and fixtures
        run: |
          python3 -I -m py_compile tools/check_production_bytecode.py tools/check_test_tiers.py
          python3 -I -m unittest discover -s tests -p 'test_production_bytecode.py' -v
      - name: Compile and install production artifacts without test execution
        env:
          CI: 'true'
        run: python3 -I tools/run_ci_gradle.py --label production-build -- ./gradlew --dependency-verification strict --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1g --no-build-cache clean installDist :app:cli:writeRuntimeClasspathManifest --stacktrace
      - name: Populate test compile dependencies on cache miss
        if: ${{ steps.gradle-cache.outputs.cache-hit != 'true' }}
        run: |
          python3 -I tools/run_ci_gradle.py --label seed-test-classes -- ./gradlew --dependency-verification strict --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1g --no-build-cache testClasses
          python3 -I tools/run_ci_gradle.py --label seed-build-logic -- ./gradlew --dependency-verification strict --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1g --no-build-cache -p build-logic testClasses
      - name: Stage pinned module files and resolution metadata
        run: |
          python3 -I tools/check_dependency_verification.py --stage-module-cache \
            "$GRADLE_USER_HOME/caches/modules-2" \
            "$RUNNER_TEMP/recursive-gradle-module-cache"
      - name: Publish current-run Gradle module cache
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gradle-module-cache
          path: ${{ runner.temp }}/recursive-gradle-module-cache
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - name: Save protected-branch Gradle module cache
        if: ${{ success() && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && steps.gradle-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/recursive-gradle-module-cache
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: Bundle compiled production inputs
        run: |
          python3 -I - <<'PY'
          from pathlib import Path
          import tarfile
          root = Path.cwd()
          modules = ("app/cli", "agent/runtime", "core/contracts", "core/session",
                     "core/tasks", "infra/model", "infra/workspace", "infra/task-store",
                     "infra/journal")
          dirs = [root / "build/install/recursive-coder",
                  root / "build/verification"]
          dirs += [root / module / sub for module in modules
                   for sub in ("build/classes/kotlin/main", "build/classes/java/main",
                               "build/libs")]
          with tarfile.open("production-artifacts.tar.gz", "w:gz") as tar:
              for directory in dirs:
                  if not directory.is_dir():
                      continue
                  for item in sorted(directory.rglob("*")):
                      if item.is_file() or item.is_symlink():
                          tar.add(item, arcname=item.relative_to(root), recursive=False)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: isolated-production-artifacts
          path: production-artifacts.tar.gz
          if-no-files-found: error
          retention-days: 3

  bytecode-verifier:
    name: Independent production distribution verifier
    needs: [bytecode-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      verified_tar_sha256: ${{ steps.approved_archive.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Audit reviewed CI action SHAs and Gradle bootstrap
        run: python3 -I tools/check_ci_bootstrap.py --audit
      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SHA-256-verified Gradle 9.8.2
        run: python3 -I tools/check_ci_bootstrap.py --install-gradle
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: isolated-production-artifacts
          path: ${{ runner.temp }}/production-input
      - name: Strictly extract production artifacts
        env:
          INPUT_TAR: ${{ runner.temp }}/production-input/production-artifacts.tar.gz
        run: |
          python3 -I - <<'PY'
          import os
          from pathlib import Path
          import tarfile
          root = Path.cwd()
          with tarfile.open(os.environ["INPUT_TAR"], "r:gz") as archive:
              members = archive.getmembers()
              if not members or len(members) > 30000:
                  raise SystemExit("Missing or excessive build artifacts")
              for member in members:
                  name = member.name
                  parts = Path(name).parts
                  permitted = (
                      name.startswith("build/install/recursive-coder/") or
                      name == "build/verification/runtime-classpath.sha256" or
                      len(parts) >= 5 and parts[0] in ("agent", "app", "core", "infra")
                      and "build" in parts and (
                          "/build/classes/" in name or "/build/libs/" in name))
                  if (not member.isfile() or not permitted
                          or Path(name).is_absolute()
                          or ".." in parts or member.size > 200_000_000):
                      raise SystemExit(f"Untrusted artifact entry: {name}")
              archive.extractall(root, members=members, filter="data")
          PY
      - name: Generate trusted Gradle 9.8.2 launcher templates
        env:
          VERIFIED_DISTRIBUTION_LIB: ${{ github.workspace }}/build/install/recursive-coder/lib
        run: |
          mkdir -p "$RUNNER_TEMP/verified-launchers"
          cat > "$RUNNER_TEMP/verified-launchers/settings.gradle.kts" <<'EOF'
          rootProject.name = "trusted-launcher-reference"
          EOF
          cat > "$RUNNER_TEMP/verified-launchers/build.gradle.kts" <<'EOF'
          import org.gradle.jvm.application.tasks.CreateStartScripts

          plugins { application }
          application {
              applicationName = "recursive-coder"
              mainClass.set("ai.yuriilab.recursivecoder.MainKt")
          }
          tasks.named<CreateStartScripts>("startScripts") {
              classpath = files(fileTree(System.getenv("VERIFIED_DISTRIBUTION_LIB")) {
                  include("*.jar")
              })
          }
          EOF
          "$RECURSIVE_VERIFIED_GRADLE" -p "$RUNNER_TEMP/verified-launchers" --no-daemon --max-workers=1 --no-build-cache startScripts
      - name: Verify in clean checkout with an isolated Python process
        run: |
          git diff --exit-code "$GITHUB_SHA" -- tools tests
          test -z "$(git ls-files --others --exclude-standard -- tools tests)"
          python3 -I tools/check_production_bytecode.py --root . \
            --trusted-launchers "$RUNNER_TEMP/verified-launchers/build/scripts" \
            --runtime-classpath-manifest build/verification/runtime-classpath.sha256
          python3 -I -m unittest discover -s tests -p 'test_production_bytecode.py' -v
      - name: Record verified archive SHA-256
        id: approved_archive
        run: |
          archive="$RUNNER_TEMP/production-input/production-artifacts.tar.gz"
          test -f "$archive"
          echo "sha256=$(sha256sum "$archive" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Publish independently verified production archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-production-artifacts
          path: ${{ runner.temp }}/production-input/production-artifacts.tar.gz
          if-no-files-found: error
          retention-days: 3

  kotlin:
    needs: [bytecode-verifier, bytecode-build]
    name: Full JVM integration and sandbox E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Audit reviewed CI action SHAs and Gradle bootstrap
        run: python3 -I tools/check_ci_bootstrap.py --audit
      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SHA-256-verified Gradle 9.8.2
        run: python3 -I tools/check_ci_bootstrap.py --install-gradle
      - name: Prepare fresh Gradle user home
        run: |
          mkdir "$RUNNER_TEMP/recursive-gradle-home"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/recursive-gradle-home" >> "$GITHUB_ENV"
      - name: Download current-run Gradle module cache
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: gradle-module-cache
          path: ${{ runner.temp }}/recursive-gradle-module-cache
      - name: Verify current-run module cache before Gradle resolution
        run: |
          python3 -I tools/check_dependency_verification.py --restore-module-cache \
            "$RUNNER_TEMP/recursive-gradle-module-cache" \
            "$GRADLE_USER_HOME/caches/modules-2"
          rm -rf "$RUNNER_TEMP/recursive-gradle-module-cache"
      - name: Resolve Gradle plugins with bounded registry retry
        run: python3 -I tools/run_ci_gradle.py --retry-resolution --label plugin-resolution -- ./gradlew --dependency-verification strict --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1g --no-build-cache help
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Python contract test dependencies
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
      # Ubuntu 24.04 AppArmor denies unprivileged userns capabilities needed
      # to configure the private network loopback. Load the narrowly scoped
      # distro bwrap profile, never disable AppArmor or share host networking.
      - name: Install bubblewrap and its restricted AppArmor profile
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor-profiles apparmor-utils
          test -x /usr/bin/bwrap
          if [ ! -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            test -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            sudo install -m 0644 \
              /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
              /etc/apparmor.d/bwrap-userns-restrict
          fi
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          sudo aa-status | grep -i bwrap
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Verify bubblewrap isolation is executable
        run: |
          /usr/bin/bwrap --die-with-parent --new-session --unshare-all \
            --tmpfs / --proc /proc --dev /dev \
            --ro-bind /usr /usr --ro-bind /bin /bin \
            --ro-bind /lib /lib --ro-bind /lib64 /lib64 \
            -- /usr/bin/true
      - name: Run full JVM and sandbox tests only after the bytecode gate
        env:
          CI: 'true'
        run: python3 -I tools/run_ci_gradle.py --label kotlin-build -- ./gradlew --dependency-verification strict --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1g --no-build-cache test integrationTest e2eTest checkPreparationHostConformance --stacktrace
      - name: Assert per-module JUnit execution evidence
        run: python3 -I tools/check_junit_evidence.py --root .
      - name: Confirm sandbox integration test was not skipped
        run: |
          python3 -I - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          files = list(Path(".").glob("**/build/test-results/test/TEST-*.xml"))
          cases = [
              case
              for path in files
              for case in ET.parse(path).iter("testcase")
              if case.get("name", "").startswith(
                  "realSeparatelyExecutedSandboxedTestPassesIfHostSupportsUserNamespaces"
              )
          ]
          if len(cases) != 1 or any(
              case.find(tag) is not None for case in cases for tag in ("skipped", "failure", "error")
          ):
              raise SystemExit("Sandbox integration MUST run and pass exactly once in CI")
          stage_port = [
              case
              for path in files
              for case in ET.parse(path).iter("testcase")
              if case.get("name", "").startswith(
                  "stageToolPortUsesRealIsolatedCheckWithoutSkippingInCi"
              )
          ]
          if len(stage_port) != 1 or any(
              case.find(tag) is not None
              for case in stage_port for tag in ("skipped", "failure", "error")
          ):
              raise SystemExit("Stage tool sandbox E2E MUST pass with 0 skips")
          developer_markers = (
              "realSandboxAndReceiptsAcceptOnlyHostApprovedSourceChanges",
              "realSandboxFailedCheckLeavesUnapprovedDirtyWorkspace",
          )
          for marker in developer_markers:
              selected = [
                  case for path in files
                  for case in ET.parse(path).iter("testcase")
                  if case.get("name", "").startswith(marker)
              ]
              if len(selected) != 1 or any(
                  case.find(tag) is not None for case in selected
                  for tag in ("skipped", "failure", "error")
              ):
                  raise SystemExit(f"Developer sandbox {marker} MUST pass once with no skips")
          print("Verified all four sandbox cases in unfiltered tests (0 skips).")
          PY
      - name: Verify focused integration excludes sandbox and E2E includes it once
        run: |
          python3 -I - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          marker = "realSeparatelyExecutedSandboxedTestPassesIfHostSupportsUserNamespaces"
          def read_cases(tier):
              files = list(Path(".").glob(f"**/build/test-results/{tier}/TEST-*.xml"))
              return [case for file in files for case in ET.parse(file).iter("testcase")]
          integration = read_cases("integrationTest")
          e2e = read_cases("e2eTest")
          sandbox = [case for case in e2e if case.get("name", "").startswith(marker)]
          stage_port = [
              case for case in e2e
              if case.get("name", "").startswith(
                  "stageToolPortUsesRealIsolatedCheckWithoutSkippingInCi")
          ]
          developer_markers = (
              "realSandboxAndReceiptsAcceptOnlyHostApprovedSourceChanges",
              "realSandboxFailedCheckLeavesUnapprovedDirtyWorkspace",
          )
          if not integration or any(
              case.get("name", "").startswith((marker, *developer_markers))
              for case in integration
          ):
              raise SystemExit("integrationTest must exclude all real-sandbox E2E tests")
          if len(sandbox) != 1 or any(
              case.find(tag) is not None for case in sandbox for tag in ("skipped", "failure", "error")
          ):
              raise SystemExit("e2eTest must select exactly one passing sandbox test")
          if len(stage_port) != 1 or any(
              case.find(tag) is not None
              for case in stage_port for tag in ("skipped", "failure", "error")
          ):
              raise SystemExit("Focused stage tool E2E must execute once without skips")
          for developer_marker in developer_markers:
              selected = [
                  case for case in e2e
                  if case.get("name", "").startswith(developer_marker)
              ]
              if len(selected) != 1 or any(
                  case.find(tag) is not None
                  for case in selected for tag in ("skipped", "failure", "error")
              ):
                  raise SystemExit(f"Focused Developer sandbox {developer_marker} must pass once")
          print("Verified focused integration excludes sandbox; four E2E cases run once.")
          PY
      - name: Publish Kotlin JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: recursive-coder-junit-results
          path: |
            **/build/test-results/test/TEST-*.xml
            **/build/test-results/integrationTest/TEST-*.xml
            **/build/test-results/e2eTest/TEST-*.xml
          if-no-files-found: error

  cli-e2e:
    needs: [bytecode-verifier]
    name: Installed CLI E2E on independently verified distribution
    # Never execute unverified Gradle/Kotlin test bytecode in this VM.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Audit reviewed CI action SHAs and Gradle bootstrap
        run: python3 -I tools/check_ci_bootstrap.py --audit
      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install CLI schema validation dependency
        run: python3 -I -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
      - name: Require clean installed-CLI test source checkout
        run: |
          git diff --exit-code "$GITHUB_SHA" -- tests contracts
          test -z "$(git ls-files --others --exclude-standard -- tests contracts)"
      - name: Download independently verified CLI archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-production-artifacts
          path: ${{ runner.temp }}/verified-cli
      - name: Restore verified installDist before installed CLI E2E
        env:
          VERIFIED_TAR_SHA256: ${{ needs.bytecode-verifier.outputs.verified_tar_sha256 }}
          VERIFIED_TAR: ${{ runner.temp }}/verified-cli/production-artifacts.tar.gz
        run: |
          python3 -I - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import shutil
          import tarfile
          import tempfile

          archive_path = Path(os.environ["VERIFIED_TAR"])
          digest = os.environ["VERIFIED_TAR_SHA256"]
          if not re.fullmatch(r"[0-9a-f]{64}", digest):
              raise SystemExit("Missing verifier-approved SHA-256")
          if hashlib.sha256(archive_path.read_bytes()).hexdigest() != digest:
              raise SystemExit("Verified CLI archive SHA-256 mismatch")

          destination = Path("build/install/recursive-coder")
          with tempfile.TemporaryDirectory(prefix="verified-cli-") as stage:
              installed = Path(stage) / "recursive-coder"
              seen = set()
              with tarfile.open(archive_path, mode="r:gz") as archive:
                  members = archive.getmembers()
                  if not members or len(members) > 30000:
                      raise SystemExit("Missing or excessive verified archive entries")
                  for member in members:
                      parts = Path(member.name).parts
                      if (not member.isfile() or Path(member.name).is_absolute()
                              or ".." in parts or member.size > 200_000_000):
                          raise SystemExit(f"Unsafe verified archive entry: {member.name}")
                      if parts[:3] != ("build", "install", "recursive-coder"):
                          continue
                      rel = Path(*parts[3:])
                      allowed = (rel.parts in (("bin", "recursive-coder"),
                                               ("bin", "recursive-coder.bat"))
                                 or (len(rel.parts) == 2 and rel.parts[0] == "lib"
                                     and rel.suffix == ".jar"))
                      if not allowed or rel in seen:
                          raise SystemExit(f"Unexpected verified install entry: {member.name}")
                      seen.add(rel)
                      out = installed / rel
                      out.parent.mkdir(parents=True, exist_ok=True)
                      with archive.extractfile(member) as inp, out.open("wb") as writer:
                          shutil.copyfileobj(inp, writer)
                      out.chmod(member.mode & 0o777)
              if (Path("bin/recursive-coder") not in seen or
                      Path("bin/recursive-coder.bat") not in seen or
                      not any(p.parts[0] == "lib" for p in seen)):
                  raise SystemExit("Incomplete independently verified installDist")
              if destination.is_symlink():
                  raise SystemExit("Refusing to replace symlinked installDist")
              if destination.exists():
                  shutil.rmtree(destination)
              shutil.copytree(installed, destination)
          print(f"Restored {len(seen)} verified CLI files: {digest}")
          PY

      # CLI writable/recursive acceptance exercises real sandbox hosts.
      # Re-establish the same restricted bubblewrap environment on this clean
      # runner; do not execute Gradle or unrelated JVM tests in this job.
      # Ubuntu 24.04 AppArmor denies unprivileged userns capabilities needed
      # to configure the private network loopback. Load the narrowly scoped
      # distro bwrap profile, never disable AppArmor or share host networking.
      - name: Install bubblewrap and its restricted AppArmor profile
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor-profiles apparmor-utils
          test -x /usr/bin/bwrap
          if [ ! -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            test -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            sudo install -m 0644 \
              /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
              /etc/apparmor.d/bwrap-userns-restrict
          fi
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          sudo aa-status | grep -i bwrap
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Verify bubblewrap isolation is executable
        run: |
          /usr/bin/bwrap --die-with-parent --new-session --unshare-all \
            --tmpfs / --proc /proc --dev /dev \
            --ro-bind /usr /usr --ro-bind /bin /bin \
            --ro-bind /lib /lib --ro-bind /lib64 /lib64 \
            -- /usr/bin/true
      - name: Execute isolated CLI contract and writable E2E
        # JAVA_TOOL_OPTIONS can add JVM arguments or banner output to a CLI test.
        # Exclude inherited JVM injection variables and isolate Python startup.
        run: |
          env -u JAVA_TOOL_OPTIONS -u JAVA_OPTS -u JDK_JAVA_OPTIONS -u _JAVA_OPTIONS python3 -I -m unittest discover -s tests -p 'test_cli_runtime_v1.py' -v
          env -u JAVA_TOOL_OPTIONS -u JAVA_OPTS -u JDK_JAVA_OPTIONS -u _JAVA_OPTIONS python3 -I -m unittest discover -s tests -p 'test_cli_writable_workflow.py' -v


  contracts:
    name: Versioned session contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Review evidence (base helpers)
        if: github.event_name == 'pull_request'
        # Explicit bash runs as bash --noprofile --norc -eo pipefail {0};
        # tests/test_ci_bootstrap.py executes this step with the same flags.
        shell: bash
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$REVIEW_BASE" =~ ^[0-9a-f]{40}$ && "$REVIEW_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse "$REVIEW_BASE^{commit}")" = "$REVIEW_BASE"
          test "$(git rev-parse "$REVIEW_HEAD^{commit}")" = "$REVIEW_HEAD"
          git merge-base "$REVIEW_BASE" "$REVIEW_HEAD" >/dev/null
          printf 'Review base: %s\nReview head: %s\n' "$REVIEW_BASE" "$REVIEW_HEAD"
          pin_helper=.claude/skills/c3-pin-check/scripts/check_c3_pins.py
          scan_helper=.claude/skills/diagnostic-vocabulary-audit/scripts/scan_literals.py
          missing=()
          for helper in "$pin_helper" "$scan_helper"; do
            git cat-file -e "$REVIEW_BASE:$helper" 2>/dev/null || missing+=("$helper")
          done
          if (( ${#missing[@]} )); then
            # A base without the review gate (for example main before its first
            # release merge) has no trusted helpers. Report the gap and let the
            # reviewer's missing-evidence rule decide; never fall back to head.
            printf 'Trusted base helpers unavailable at %s: %s\nNo review evidence produced.\n' "$REVIEW_BASE" "${missing[*]}"
            exit 0
          fi
          helpers=$(mktemp -d "$RUNNER_TEMP/review-helpers.XXXXXX")
          trap 'rm -rf -- "$helpers"' EXIT
          git show "$REVIEW_BASE:$pin_helper" > "$helpers/check_c3_pins.py"
          git show "$REVIEW_BASE:$scan_helper" > "$helpers/scan_literals.py"
          sha256sum "$helpers/check_c3_pins.py" "$helpers/scan_literals.py"
          # Helper output contains PR-controlled text. Disable workflow commands.
          token=$(python3 -I -c 'import secrets; print(secrets.token_hex(32))')
          echo "::stop-commands::$token"
          pin_status=0
          scan_status=0
          python3 -I "$helpers/check_c3_pins.py" --repo "$GITHUB_WORKSPACE" --base "$REVIEW_BASE" --head "$REVIEW_HEAD" || pin_status=$?
          python3 -I "$helpers/scan_literals.py" --repo "$GITHUB_WORKSPACE" --base "$REVIEW_BASE" --head "$REVIEW_HEAD" || scan_status=$?
          echo "::$token::"
          printf 'C3 pin check exit: %s\nVocabulary scanner exit: %s\n' "$pin_status" "$scan_status"
          test "$pin_status" -eq 0 && test "$scan_status" -eq 0
      - name: Audit reviewed CI action SHAs and Gradle bootstrap
        run: python3 -I tools/check_ci_bootstrap.py --audit
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Python contract test dependencies
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Reject altered action refs and Gradle checksum inputs
        run: python3 -I -m unittest discover -s tests -p 'test_ci_bootstrap.py' -v
      - name: Test JUnit evidence and import-order guards
        run: python3 -I -m unittest discover -s tests -p 'test_junit_evidence.py' -v
      - name: Check import order in issue 36 test classes
        run: python3 -I tools/check_junit_evidence.py --root . --imports-only
      - name: Test review gate helper scripts
        run: python3 -I -m unittest discover -s tests -p 'test_review_skill_scripts.py' -v
      - name: Enforce English-only repository documentation
        shell: bash
        run: |
          # Scan every tracked Markdown file. The listing goes through a file
          # so that a failing git ls-files fails the step; a process
          # substitution would drop its exit status. grep exits 1 only when no
          # file matches; a match (0) or any error such as a missing file
          # (>= 2) fails the guard.
          listing=$(mktemp)
          trap 'rm -f -- "$listing"' EXIT
          git ls-files -z -- '*.md' > "$listing"
          mapfile -d '' docs < "$listing"
          test "${#docs[@]}" -gt 0
          status=0
          LC_ALL=C.UTF-8 grep -nP '[\p{Cyrillic}]' -- "${docs[@]}" || status=$?
          if [ "$status" -ne 1 ]; then
            echo "Documentation must use English only (grep exit $status)"
            exit 1
          fi
          echo "Verified ${#docs[@]} tracked Markdown files contain no Cyrillic"
      - name: Validate full schema, fixtures and negative compatibility cases
        run: python -m unittest discover -s tests -p 'test_contract*.py' -v
      - name: Run standalone legacy compatibility cases and keyword guard
        run: node --test contracts/v1/session-v1.test.mjs
